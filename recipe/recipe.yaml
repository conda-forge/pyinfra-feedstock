schema_version: 1

context:
  name: pyinfra
  version: "3.11.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pyinfra-${{ version }}.tar.gz
  sha256: 6017acf7b9c2a691217a038728ce4e4c703a986e6930c43c0e8b55d2a8a7265d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - pyinfra=pyinfra_cli.main:main

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - hatchling
    - uv-dynamic-versioning
  run:
    - python >=${{ python_min }}
    - gevent >=1.5
    - paramiko >=3.2,<6
    - jinja2 >3,<4
    - python-dateutil >2,<3
    - typeguard >=4,<5
    - distro >=1.6,<2
    - packaging >=16.1
    - typing_extensions
    - pydantic >=2.11,<3
    - types-paramiko >=2.7,<6
    - rich >=13.7.1
    - cyclopts >=4,<5

tests:
  - python:
      imports:
        - pyinfra
        - pyinfra_cli
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - pyinfra --help

about:
  summary: pyinfra automates/provisions/manages/deploys infrastructure.
  license: MIT
  license_file: LICENSE.md
  homepage: https://pyinfra.com
  repository: https://github.com/Fizzadar/pyinfra
  documentation: https://docs.pyinfra.com/

extra:
  recipe-maintainers:
    - thewchan
